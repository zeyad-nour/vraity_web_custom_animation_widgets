<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Variety - Architectural Light Pillars</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #060A0C; overflow: hidden; }
  </style>
</head>
<body>

  <!-- انسخ من أول هنا لـ Elementor -->
  <div id="vss-pillars-stage">
    <canvas id="vss-pillars-canvas"></canvas>
  </div>

  <style>
    #vss-pillars-stage {
      position: relative;
      width: 100%;
      height: 100vh;
      background: #060A0C;
      overflow: hidden;
    }
    #vss-pillars-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>

  <script>
  (function() {
    const stage = document.getElementById('vss-pillars-stage');
    const canvas = document.getElementById('vss-pillars-canvas');
    if (!stage || !canvas) return;

    const ctx = canvas.getContext('2d');
    let width, height, dpr;
    let mouse = { x: -9999, y: -9999 };

    function resize() {
      const rect = stage.getBoundingClientRect();
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = rect.width;
      height = rect.height;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resize);
    resize();

    stage.addEventListener('mousemove', (e) => {
      const rect = stage.getBoundingClientRect();
      mouse.x = e.clientX - rect.left;
      mouse.y = e.clientY - rect.top;
    });

    stage.addEventListener('mouseleave', () => {
      mouse.x = -9999;
    });

    const PILLAR_COUNT = 22;
    const pillars = Array.from({ length: PILLAR_COUNT }, (_, i) => ({
      speed: (0.006 + Math.random() * 0.01) * (i % 2 === 0 ? 1 : -1),
      phase: Math.random() * Math.PI * 2,
      beamLength: 0.25 + Math.random() * 0.3,
      hoverStrength: 0
    }));

    let time = 0;

    function render() {
      time += 1;
      ctx.clearRect(0, 0, width, height);

      const colW = width / PILLAR_COUNT;

      pillars.forEach((p, i) => {
        const x = i * colW;
        const centerCol = x + colW * 0.5;
        const dist = Math.abs(mouse.x - centerCol);
        const targetHover = dist < colW * 2.2 ? 1 - dist / (colW * 2.2) : 0;
        p.hoverStrength += (targetHover - p.hoverStrength) * 0.1;

        // خلفية العمود عند اقتراب الماوس
        if (p.hoverStrength > 0.01) {
          const hoverGrad = ctx.createLinearGradient(x, 0, x, height);
          hoverGrad.addColorStop(0, 'rgba(10, 184, 236, 0)');
          hoverGrad.addColorStop(0.5, `rgba(10, 184, 236, ${0.12 * p.hoverStrength})`);
          hoverGrad.addColorStop(1, 'rgba(10, 184, 236, 0)');
          ctx.fillStyle = hoverGrad;
          ctx.fillRect(x, 0, colW, height);
        }

        // الخط الفاصل للعمود
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.strokeStyle = `rgba(255, 255, 255, ${0.04 + p.hoverStrength * 0.12})`;
        ctx.lineWidth = 1;
        ctx.stroke();

        // شعاع الطاقة الصاعد/الهابط على حافة العمود
        const posNorm = (Math.sin(time * p.speed + p.phase) + 1) * 0.5;
        const beamY = posNorm * height;
        const beamH = height * p.beamLength;

        const beamGrad = ctx.createLinearGradient(x, beamY - beamH * 0.5, x, beamY + beamH * 0.5);
        beamGrad.addColorStop(0, 'rgba(10, 184, 236, 0)');
        beamGrad.addColorStop(0.5, `rgba(10, 184, 236, ${0.45 + p.hoverStrength * 0.5})`);
        beamGrad.addColorStop(1, 'rgba(10, 184, 236, 0)');

        ctx.beginPath();
        ctx.moveTo(x, beamY - beamH * 0.5);
        ctx.lineTo(x, beamY + beamH * 0.5);
        ctx.strokeStyle = beamGrad;
        ctx.lineWidth = 1.5 + p.hoverStrength * 1.5;
        ctx.stroke();
      });

      requestAnimationFrame(render);
    }

    render();
  })();
  </script>

</body>
</html>
