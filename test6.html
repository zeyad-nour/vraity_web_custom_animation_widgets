<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Variety - Magnetic Light Ribbons</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #060A0C; overflow: hidden; }
  </style>
</head>
<body>

  <!-- انسخ من أول هنا لـ Elementor -->
  <div id="vss-ribbon-stage">
    <canvas id="vss-ribbon-canvas"></canvas>
  </div>

  <style>
    #vss-ribbon-stage {
      position: relative;
      width: 100%;
      height: 100vh;
      background: radial-gradient(circle at 75% 50%, #091c26 0%, #060A0C 72%);
      overflow: hidden;
    }
    #vss-ribbon-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>

  <script>
  (function() {
    const stage = document.getElementById('vss-ribbon-stage');
    const canvas = document.getElementById('vss-ribbon-canvas');
    if (!stage || !canvas) return;

    const ctx = canvas.getContext('2d');
    let width, height, dpr;
    let mouse = { x: 0, y: 0, targetX: 0, targetY: 0 };

    function resize() {
      const rect = stage.getBoundingClientRect();
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = rect.width;
      height = rect.height;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resize);
    resize();

    mouse.x = mouse.targetX = width * 0.7;
    mouse.y = mouse.targetY = height * 0.5;

    stage.addEventListener('mousemove', (e) => {
      const rect = stage.getBoundingClientRect();
      mouse.targetX = e.clientX - rect.left;
      mouse.targetY = e.clientY - rect.top;
    });

    let time = 0;
    const RIBBON_COUNT = 26;

    function render() {
      time += 0.015;
      mouse.x += (mouse.targetX - mouse.x) * 0.07;
      mouse.y += (mouse.targetY - mouse.y) * 0.07;

      ctx.clearRect(0, 0, width, height);
      ctx.globalCompositeOperation = 'lighter';

      for (let i = 0; i < RIBBON_COUNT; i++) {
        const progress = i / RIBBON_COUNT;
        const alpha = Math.sin(progress * Math.PI) * 0.32;
        const yBase = height * (0.28 + progress * 0.44);

        ctx.beginPath();
        for (let x = -40; x <= width + 40; x += 18) {
          const nx = x / width;
          const wave1 = Math.sin(nx * 4.5 + time + progress * 3.2) * (55 + progress * 40);
          const wave2 = Math.cos(nx * 2.2 - time * 0.7 + progress * 2) * 35;

          // جذب مغناطيسي ناحية الماوس
          const dx = x - mouse.x;
          const dy = yBase - mouse.y;
          const dist = Math.hypot(dx, dy);
          const pull = Math.max(0, 1 - dist / 340);
          const smoothPull = pull * pull * (3 - 2 * pull);
          const magnetOffset = (mouse.y - yBase) * smoothPull * 0.55;

          const y = yBase + wave1 + wave2 + magnetOffset;

          if (x === -40) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }

        ctx.strokeStyle = i % 4 === 0
          ? `rgba(140, 235, 255, ${alpha * 1.3})`
          : `rgba(10, 184, 236, ${alpha})`;
        ctx.lineWidth = i % 5 === 0 ? 1.8 : 1;
        ctx.stroke();
      }

      ctx.globalCompositeOperation = 'source-over';
      requestAnimationFrame(render);
    }

    render();
  })();
  </script>

</body>
</html>
