<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    background:#050b12;
    overflow:hidden;
    font-family:Arial;
    color:white;
}

.hero{
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:space-around;
    padding:5%;
}

.scene{
    width:350px;
    height:350px;
    perspective:1000px;
}

.orb{
    width:260px;
    height:260px;
    position:relative;
    margin:auto;
    top:45px;
    border-radius:50%;

    background:
    radial-gradient(circle at 30% 25%,
    rgba(10,184,236,.7),
    rgba(5,20,35,.9) 55%,
    #02060b);

    box-shadow:
    0 0 50px rgba(10,184,236,.3),
    inset -20px -20px 50px rgba(0,0,0,.7);

    transition:transform .2s ease-out;
}

.ring{
    position:absolute;
    width:360px;
    height:120px;
    border:2px solid rgba(10,184,236,.65);
    border-radius:50%;
    top:115px;
    left:-50px;
    transform:rotateX(65deg);
    animation:rotate 8s linear infinite;
}

.ring.two{
    transform:rotateX(65deg) rotateY(65deg);
    border-color:rgba(255,255,255,.3);
    animation-direction:reverse;
}

@keyframes rotate{
    to{rotate:360deg}
}

.content h1{font-size:65px}
.content span{color:#0ab8ec}

@media(max-width:768px){
    .hero{flex-direction:column;text-align:center}
    .content h1{font-size:40px}
    .scene{transform:scale(.8)}
}
</style>
</head>

<body>

<section class="hero">

<div class="content">
<h1>We Create<br><span>Possibilities.</span></h1>
</div>

<div class="scene">
    <div class="orb" id="orb">
        <div class="ring"></div>
        <div class="ring two"></div>
    </div>
</div>

</section>

<script>
const orb=document.getElementById("orb");

window.addEventListener("mousemove",e=>{
    const x=(e.clientX/window.innerWidth-.5)*2;
    const y=(e.clientY/window.innerHeight-.5)*2;

    orb.style.transform=
    `rotateY(${x*25}deg) rotateX(${-y*25}deg)`;
});
</script>

</body>
</html>
