<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Variety - Neural Network</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
    background:#050b12;
    color:white;
    font-family:Arial,sans-serif;
}

.hero {
    height:100vh;
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:center;
    padding:10%;
}

canvas {
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

.content {
    position:relative;
    z-index:2;
    max-width:650px;
}

h1 {
    font-size:clamp(45px,7vw,90px);
    line-height:1.05;
}

h1 span { color:#0ab8ec; }

p {
    margin-top:25px;
    color:#a6b5c2;
    font-size:18px;
    line-height:1.7;
}
</style>
</head>

<body>

<section class="hero">

<canvas id="network"></canvas>

<div class="content">
    <h1>Ideas Into <span>Reality.</span></h1>
    <p>
        We build intelligent digital experiences
        that connect creativity with technology.
    </p>
</div>

</section>

<script>
const canvas = document.getElementById("network");
const ctx = canvas.getContext("2d");

let w,h,particles=[];
let mouse={x:-1000,y:-1000};

function resize(){
    const dpr=Math.min(devicePixelRatio||1,2);
    w=canvas.clientWidth;
    h=canvas.clientHeight;

    canvas.width=w*dpr;
    canvas.height=h*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);

    particles=Array.from({length:90},()=>({
        x:Math.random()*w,
        y:Math.random()*h,
        vx:(Math.random()-.5)*.5,
        vy:(Math.random()-.5)*.5,
        size:Math.random()*2+1
    }));
}

window.addEventListener("resize",resize);
resize();

window.addEventListener("mousemove",e=>{
    mouse.x=e.clientX;
    mouse.y=e.clientY;
});

function animate(){
    ctx.clearRect(0,0,w,h);

    particles.forEach((p,i)=>{
        p.x+=p.vx;
        p.y+=p.vy;

        if(p.x<0||p.x>w)p.vx*=-1;
        if(p.y<0||p.y>h)p.vy*=-1;

        const dx=mouse.x-p.x;
        const dy=mouse.y-p.y;
        const distance=Math.hypot(dx,dy);

        if(distance<140){
            p.x-=dx*.002;
            p.y-=dy*.002;
        }

        particles.slice(i+1).forEach(q=>{
            const d=Math.hypot(p.x-q.x,p.y-q.y);

            if(d<120){
                ctx.beginPath();
                ctx.moveTo(p.x,p.y);
                ctx.lineTo(q.x,q.y);
                ctx.strokeStyle=`rgba(10,184,236,${1-d/120})`;
                ctx.lineWidth=.6;
                ctx.stroke();
            }
        });

        ctx.beginPath();
        ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
        ctx.fillStyle="#0ab8ec";
        ctx.shadowColor="#0ab8ec";
        ctx.shadowBlur=8;
        ctx.fill();
        ctx.shadowBlur=0;
    });

    requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
